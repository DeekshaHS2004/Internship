<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Basics Demo</title>

    <style>
        /* ===== 1. BASIC SELECTORS ===== */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        #main-box {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            border: 2px solid #333;
            border-radius: 10px;
        }

        .highlight {
            color: white;
            background-color: #4CAF50;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* ===== 2. TEXT STYLING ===== */
        p {
            color: #555;
            line-height: 1.6;
            font-size: 16px;
        }

        .bold-text {
            font-weight: bold;
        }

        .italic-text {
            font-style: italic;
        }

        .underline-text {
            text-decoration: underline;
        }

        /* ===== 3. BOX MODEL ===== */
        .box {
            width: 200px;
            height: 100px;
            background-color: #ff9800;
            margin: 10px;
            padding: 10px;
            border: 3px solid #333;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        /* ===== 4. BUTTON STYLING + HOVER ===== */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn:hover {
            background-color: #0b7dda;
            transform: scale(1.05);
        }

        /* ===== 5. FLEXBOX ===== */
        .flex-container {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-top: 20px;
        }

        .flex-item {
            background-color: #9c27b0;
            color: white;
            padding: 15px;
            flex: 1;
            text-align: center;
            border-radius: 5px;
        }

        /* ===== 6. GRID ===== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .grid-item {
            background-color: #607d8b;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }

        /* ===== 7. POSITIONING ===== */
        .relative-box {
            position: relative;
            background-color: #ffc107;
            height: 100px;
            margin-top: 20px;
        }

        .absolute-box {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background-color: #e91e63;
            color: white;
            padding: 5px 10px;
        }

        /* ===== 8. LINKS ===== */
        a {
            color: #e91e63;
        }

        a:hover {
            color: #000;
        }
    </style>

</head>
<body>

    <h1>CSS Basics Demo</h1>

    <div id="main-box">
        <p>This is a <span class="highlight">highlighted</span> text example.</p>

        <p class="bold-text">This text is bold.</p>
        <p class="italic-text">This text is italic.</p>
        <p class="underline-text">This text is underlined.</p>

        <div class="box">Box Model Example</div>

        <br>
        <a href="#" class="btn">Hover Me Button</a>

        <!-- Flexbox -->
        <div class="flex-container">
            <div class="flex-item">Flex 1</div>
            <div class="flex-item">Flex 2</div>
            <div class="flex-item">Flex 3</div>
        </div>

        <!-- Grid -->
        <div class="grid-container">
            <div class="grid-item">Grid 1</div>
            <div class="grid-item">Grid 2</div>
            <div class="grid-item">Grid 3</div>
            <div class="grid-item">Grid 4</div>
            <div class="grid-item">Grid 5</div>
            <div class="grid-item">Grid 6</div>
        </div>

        <!-- Position -->
        <div class="relative-box">
            Relative Box
            <div class="absolute-box">Absolute</div>
        </div>

        <p>Visit <a href="#">this link</a> and hover it.</p>
    </div>

</body>
</html>
